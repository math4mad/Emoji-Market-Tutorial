      - icon: github
        href: https://github.com/math4mad/Emoji-Market-Tutorial
  sidebar:
    style: "docked"
    search: true
    collapse-level: 2
    contents:
      - section: "开始"
        contents:
          - index.qmd
      - section: "教程"
        contents:
          - chapters/01-origin.qmd
          - chapters/02-exchange-matrix.qmd
          - chapters/03-crisis.qmd
          - chapters/04-money-evolution.qmd
          - chapters/05-international-trade.qmd
          - chapters/06-energy-credits.qmd
          - chapters/07-ai-agents.qmd
          - chapters/08-metaverse.qmd
          - chapters/09-intelligence.qmd
          - chapters/10-dashboard.qmd

format:
  html:
    theme:
      light: [cosmo, styles.scss]
      dark: [darkly, styles.scss]
    toc: true
    toc-location: right
    toc-title: "本章目录"
    code-copy: true
    code-overflow: wrap
    code-link: true
    code-tools: true
    include-in-header:
      text: |
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    include-after-body:
      text: |
        <script>
        document.addEventListener("DOMContentLoaded", () => {
          // Reading progress bar
          const bar = document.createElement("div");
          bar.className = "reading-progress";
          document.body.prepend(bar);
          window.addEventListener("scroll", () => {
            const h = document.documentElement;
            const pct = (h.scrollTop / (h.scrollHeight - h.clientHeight)) * 100;
            bar.style.width = pct + "%";
          });

          // Add copy-to-clipboard feedback
          document.querySelectorAll('button.copy-code').forEach(btn => {
            btn.addEventListener('click', () => {
              btn.textContent = '已复制 ✓';
              setTimeout(() => { btn.textContent = 'Copy'; }, 1500);
            });
          });
        });
        </script>

lang: zh
