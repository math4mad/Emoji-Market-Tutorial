  image: images/cover.jpg
  favicon: images/favicon.svg
  page-navigation: true
  back-to-top-navigation: true
  navbar:
    background: transparent
    left:
      - href: index.qmd
        text: 首页
      - text: 教程章节
        menu:
          - href: chapters/01-origin.qmd
            text: "01 · 缘起"
