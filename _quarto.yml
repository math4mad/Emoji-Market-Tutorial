          - href: chapters/03-crisis.qmd
            text: "03 · 金融危机"
          - href: chapters/04-money-evolution.qmd
            text: "04 · 货币进化"
          - href: chapters/05-international-trade.qmd
            text: "05 · 国际贸易"
          - href: chapters/06-energy-credits.qmd
            text: "06 · 能量块"
          - href: chapters/07-ai-agents.qmd
            text: "07 · AI 代理人"
          - href: chapters/08-metaverse.qmd
            text: "08 · 元宇宙出口"
          - href: chapters/09-intelligence.qmd
            text: "09 · 从市场到智能"
          - href: chapters/10-dashboard.qmd
            text: "10 · 仪表盘"
      - href: chapters/10-dashboard.qmd
