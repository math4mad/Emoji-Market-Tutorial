name: Publish Quarto Tutorial to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# quarto-dev/quarto-actions/publish needs to push the rendered site onto gh-pages,
# and GitHub Pages has to be able to read it.
permissions:
  contents: write
  pages: write
  id-token: write

# Avoid two deploys stepping on each other; cancel in-progress runs when a new
# commit arrives.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Figures / embeds in .qmd files may need numpy/matplotlib/networkx.
      # We never need torch in this tutorial, so the run stays fast.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install figure / experiment dependencies
        run: python -m pip install --upgrade pip numpy scipy matplotlib pandas networkx

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.6.42"

      # Publishes the rendered site to the gh-pages branch of this repository.
      - name: Publish to GitHub Pages (gh-pages branch)
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
